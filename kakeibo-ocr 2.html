<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  #app {
    font-family: 'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
    background: #ECE8DC;
    background-image: linear-gradient(#C7BFAB 1px, transparent 1px), linear-gradient(90deg, #C7BFAB 1px, transparent 1px);
    background-size: 24px 24px;
    color: #2B2A28;
    padding: 20px 14px 60px;
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .card { background: #FBFAF6; border: 1px solid #C7BFAB; border-radius: 4px; }
  .section-label { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  .section-label .idx { font-family:'JetBrains Mono',monospace; font-size:11px; color:#A63A3A; font-weight:700; }
  .section-label .title { font-size:13.5px; font-weight:700; color:#5C574C; }
  .section-label .line { flex:1; height:1px; background:#C7BFAB; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  .btn-primary { flex:1; background:#33475B; color:#FBFAF6; border:none; border-radius:4px; padding:12px 10px; font-size:13.5px; font-weight:700; }
  .btn-secondary { flex:1; background:#FBFAF6; color:#33475B; border:1px solid #33475B; border-radius:4px; padding:12px 10px; font-size:13.5px; font-weight:700; }
  .input { padding:8px 10px; border-radius:3px; border:1px solid #C7BFAB; font-size:13px; width:100%; }
  .empty { border:1px dashed #C7BFAB; border-radius:4px; padding:16px; margin-bottom:20px; text-align:center; font-size:12.5px; color:#5C574C; background:#FBFAF6; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px dashed #C7BFAB; }
  .row:last-child { border-bottom:none; }
</style>
<script>
(function () {
  const CATEGORIES = ["食費", "日用品", "外食", "交通", "その他"];
  const CATEGORY_COLORS = { 食費:"#A63A3A", 日用品:"#33475B", 外食:"#B8863B", 交通:"#4B6B4E", その他:"#8A8375" };
  const STORAGE_KEY = "kakeibo:receipts";
  let receipts = [];
  let pendingImage = null; // { dataUrl, guessedAmount }
  let charts = {};

  const app = document.getElementById("app");
  const yen = n => "¥" + Number(n).toLocaleString("ja-JP");
  const todayISO = () => new Date().toISOString().slice(0,10);
  const monthKey = d => d.slice(0,7);
  const monthLabel = k => `${Number(k.split("-")[1])}月`;

  window.addEventListener("error", (e) => {
    const el = document.getElementById("statusMsg");
    if (el) el.textContent = "エラーが発生しました: " + e.message;
  });

  async function load() {
    try {
      const res = await window.storage.get(STORAGE_KEY);
      if (res) receipts = JSON.parse(res.value);
    } catch (e) { /* 未保存なら空のまま */ }
    render();
  }

  async function persist() {
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(receipts)); }
    catch (e) { console.error("保存に失敗しました", e); }
  }

  function addReceipt(r) {
    receipts.unshift(r);
    persist();
    render();
  }

  function deleteReceipt(id) {
    receipts = receipts.filter(r => r.id !== id);
    persist();
    render();
  }

  // レシートOCRの生テキストから合計金額らしき数字を推測する簡易パーサー
  function guessAmount(text) {
    const lines = text.split("\\n");
    let best = null;
    const totalKeywords = ["合計", "計", "total", "TOTAL"];
    for (const line of lines) {
      const hasKeyword = totalKeywords.some(k => line.includes(k));
      const matches = line.match(/[¥\\d,]{3,}/g);
      if (matches) {
        for (const m of matches) {
          const num = Number(m.replace(/[¥,]/g, ""));
          if (!isNaN(num) && num > 0) {
            if (hasKeyword) return num; // 「合計」行の数字を優先
            if (best === null || num > best) best = num;
          }
        }
      }
    }
    return best;
  }

  function setStatus(msg) {
    const el = document.getElementById("statusMsg");
    if (el) el.textContent = msg || "";
  }

  async function handleFile(file) {
    if (!file) { setStatus("画像が選択されませんでした"); return; }
    setStatus("画像を読み込み中…");
    const reader = new FileReader();
    reader.onerror = () => setStatus("画像の読み込みに失敗しました");
    reader.onload = async (e) => {
      pendingImage = { dataUrl: e.target.result, guessedAmount: null, store: "", category: "食費", loading: true, error: false };
      setStatus("");
      render();
      try {
        if (typeof Tesseract === "undefined") throw new Error("Tesseractが読み込まれていません");
        const { data } = await Tesseract.recognize(e.target.result, "jpn+eng");
        pendingImage.guessedAmount = guessAmount(data.text) || "";
        pendingImage.loading = false;
      } catch (err) {
        pendingImage.loading = false;
        pendingImage.error = true;
        setStatus("文字の読み取りに失敗しました。金額は手入力してください");
      }
      render();
    };
    reader.readAsDataURL(file);
  }

  function confirmPending(amount, store, category) {
    if (!amount || !store) return;
    addReceipt({
      id: String(Date.now()) + Math.random().toString(36).slice(2,7),
      store, amount: Number(amount), category, date: todayISO(),
    });
    pendingImage = null;
  }

  function render() {
    const currentMonthKey = monthKey(todayISO());
    const monthReceipts = receipts.filter(r => monthKey(r.date) === currentMonthKey);
    const total = monthReceipts.reduce((s,r) => s + r.amount, 0);

    const byCatMap = {}; CATEGORIES.forEach(c => byCatMap[c] = 0);
    monthReceipts.forEach(r => byCatMap[r.category] += r.amount);
    const byCategory = CATEGORIES.map(c => ({ name:c, value: byCatMap[c] })).filter(d => d.value > 0);

    const histMap = {};
    receipts.forEach(r => { const k = monthKey(r.date); histMap[k] = (histMap[k]||0) + r.amount; });
    if (!histMap[currentMonthKey]) histMap[currentMonthKey] = 0;
    const history = Object.keys(histMap).sort().slice(-4).map(k => ({ key:k, month: monthLabel(k), total: histMap[k] }));
    const prevTotal = history.length >= 2 ? history[history.length-2].total : null;
    const diff = prevTotal === null ? null : total - prevTotal;

    app.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;">
        <div>
          <div class="mono" style="font-size:11px;color:#5C574C;letter-spacing:2px;">KAKEIBO LEDGER</div>
          <div style="font-size:24px;font-weight:900;margin-top:2px;">${monthLabel(currentMonthKey)}の家計台帳</div>
        </div>
        <div style="width:78px;height:78px;border-radius:50%;border:3px solid #A63A3A;color:#A63A3A;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);background:rgba(166,58,58,0.04);flex-shrink:0;">
          <div class="mono" style="font-size:9px;font-weight:700;">今月計</div>
          <div class="mono" style="font-size:13px;font-weight:700;text-align:center;">${yen(total)}</div>
        </div>
      </div>

      ${diff !== null ? `
      <div class="card" style="padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;color:#5C574C;">先月比</span>
        <span class="mono" style="font-size:15px;font-weight:700;color:${diff<=0 ? '#4B6B4E' : '#A63A3A'};">${diff<=0?'▼ ':'▲ '}${yen(Math.abs(diff))}</span>
      </div>` : ``}

      <div class="section-label"><span class="idx">01</span><span class="title">月ごとの支出</span><div class="line"></div></div>
      <div class="card" style="padding:12px 8px 4px;margin-bottom:20px;">
        <canvas id="monthChart" height="150"></canvas>
      </div>

      <div class="section-label"><span class="idx">02</span><span class="title">カテゴリ別の内訳</span><div class="line"></div></div>
      ${byCategory.length === 0 ? `<div class="empty">今月のレシートはまだありません</div>` : `
      <div class="card" style="padding:14px;margin-bottom:20px;display:flex;align-items:center;gap:12px;">
        <div style="width:110px;height:110px;flex-shrink:0;"><canvas id="catChart"></canvas></div>
        <div style="flex:1;">
          ${byCategory.sort((a,b)=>b.value-a.value).map(c => `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="width:8px;height:8px;border-radius:50%;background:${CATEGORY_COLORS[c.name]};display:inline-block;"></span>
                <span style="font-size:12.5px;">${c.name}</span>
              </div>
              <span class="mono" style="font-size:12.5px;font-weight:600;">${yen(c.value)}</span>
            </div>`).join("")}
        </div>
      </div>`}

      <div class="section-label"><span class="idx">03</span><span class="title">レシートを記帳する</span><div class="line"></div></div>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button id="cameraLiveBtn" class="btn-primary">📷 その場で撮影</button>
        <label id="cameraBtn" for="cameraInput" class="btn-secondary" style="display:flex;align-items:center;justify-content:center;">アルバムから選ぶ</label>
      </div>
      <div style="margin-bottom:14px;">
        <button id="manualBtn" class="btn-secondary" style="width:100%;">+ 手入力で追加</button>
      </div>
      <input id="cameraInput" type="file" accept="image/*" style="position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;" />
      <div id="statusMsg" style="font-size:11.5px;color:#5C574C;margin:-8px 0 10px;"></div>
      <div id="liveCameraWrap"></div>

      <div id="manualFormWrap"></div>
      <div id="pendingWrap"></div>

      <div class="section-label"><span class="idx">04</span><span class="title">記帳履歴</span><div class="line"></div></div>
      ${receipts.length === 0 ? `<div class="empty">まだ記帳がありません。撮影か手入力で最初の一件を追加してください</div>` : `
      <div class="card" style="overflow:hidden;">
        ${receipts.map(r => `
          <div class="row">
            <div>
              <div style="font-size:13.5px;font-weight:500;">${r.store}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:2px;">
                <span class="mono" style="font-size:10px;color:${CATEGORY_COLORS[r.category]};border:1px solid ${CATEGORY_COLORS[r.category]};border-radius:2px;padding:1px 5px;">${r.category}</span>
                <span class="mono" style="font-size:10.5px;color:#5C574C;">${r.date.slice(5).replace('-','/')}</span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="mono" style="font-size:14px;font-weight:700;">${yen(r.amount)}</span>
              <button data-del="${r.id}" style="background:none;border:none;color:#5C574C;font-size:16px;padding:4px;">×</button>
            </div>
          </div>`).join("")}
      </div>`}
    `;

    // チャート描画(失敗してもボタン等の設定は止めない)
    try {
      if (charts.month) charts.month.destroy();
      charts.month = new Chart(document.getElementById("monthChart"), {
        type: "bar",
        data: { labels: history.map(h=>h.month), datasets: [{ data: history.map(h=>h.total), backgroundColor: history.map(h => h.key === currentMonthKey ? "#A63A3A" : "#33475B"), borderRadius: 3 }] },
        options: { plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>`¥${v/1000}k`, font:{size:10} }, grid:{color:"#C7BFAB"} }, x:{ grid:{display:false} } } }
      });
      const catCanvas = document.getElementById("catChart");
      if (catCanvas) {
        if (charts.cat) charts.cat.destroy();
        charts.cat = new Chart(catCanvas, {
          type: "doughnut",
          data: { labels: byCategory.map(c=>c.name), datasets: [{ data: byCategory.map(c=>c.value), backgroundColor: byCategory.map(c=>CATEGORY_COLORS[c.name]) }] },
          options: { plugins:{ legend:{display:false} }, cutout:"60%" }
        });
      }
    } catch (chartErr) {
      console.error("グラフの描画に失敗しました", chartErr);
    }

    // イベント紐付け
    const cameraInput = document.getElementById("cameraInput");
    cameraInput.addEventListener("change", e => {
      setStatus("");
      handleFile(e.target.files && e.target.files[0]);
    });
    document.getElementById("cameraLiveBtn").addEventListener("click", startLiveCamera);
    document.getElementById("manualBtn").addEventListener("click", () => {
      renderManualForm();
    });
    document.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", () => deleteReceipt(btn.getAttribute("data-del")));
    });

    renderPending();
  }

  let mediaStream = null;

  async function startLiveCamera() {
    const wrap = document.getElementById("liveCameraWrap");
    wrap.innerHTML = `
      <div class="card" style="padding:10px;margin-bottom:16px;">
        <video id="liveVideo" autoplay playsinline muted style="width:100%;border-radius:3px;background:#000;"></video>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button id="shutterBtn" class="btn-primary">シャッター</button>
          <button id="closeCamBtn" class="btn-secondary">閉じる</button>
        </div>
        <div id="camError" style="font-size:11.5px;color:#A63A3A;margin-top:6px;"></div>
      </div>`;
    document.getElementById("closeCamBtn").addEventListener("click", stopLiveCamera);
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      const video = document.getElementById("liveVideo");
      video.srcObject = mediaStream;
      document.getElementById("shutterBtn").addEventListener("click", () => {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
        stopLiveCamera();
        pendingImage = { dataUrl, guessedAmount: null, store: "", category: "食費", loading: true, error: false };
        render();
        runOcr(dataUrl);
      });
    } catch (err) {
      document.getElementById("camError").textContent = "カメラを起動できませんでした。「アルバムから選ぶ」をお試しください";
    }
  }

  function stopLiveCamera() {
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    const wrap = document.getElementById("liveCameraWrap");
    if (wrap) wrap.innerHTML = "";
  }

  async function runOcr(dataUrl) {
    try {
      if (typeof Tesseract === "undefined") throw new Error("Tesseractが読み込まれていません");
      const { data } = await Tesseract.recognize(dataUrl, "jpn+eng");
      pendingImage.guessedAmount = guessAmount(data.text) || "";
      pendingImage.loading = false;
    } catch (err) {
      pendingImage.loading = false;
      pendingImage.error = true;
      setStatus("文字の読み取りに失敗しました。金額は手入力してください");
    }
    render();
  }

  function renderManualForm() {
    const wrap = document.getElementById("manualFormWrap");
    wrap.innerHTML = `
      <div class="card" style="padding:12px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;">
        <input id="mStore" class="input" placeholder="店名" />
        <input id="mAmount" class="input" placeholder="金額" type="number" />
        <select id="mCategory" class="input">${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
        <button id="mSubmit" style="background:#A63A3A;color:#FBFAF6;border:none;border-radius:3px;padding:9px 0;font-size:13px;font-weight:700;">記帳する</button>
      </div>`;
    document.getElementById("mSubmit").addEventListener("click", () => {
      const store = document.getElementById("mStore").value;
      const amount = document.getElementById("mAmount").value;
      const category = document.getElementById("mCategory").value;
      if (!store || !amount) return;
      addReceipt({ id:String(Date.now())+Math.random().toString(36).slice(2,7), store, amount:Number(amount), category, date: todayISO() });
    });
  }

  function renderPending() {
    const wrap = document.getElementById("pendingWrap");
    if (!pendingImage) { wrap.innerHTML = ""; return; }
    wrap.innerHTML = `
      <div class="card" style="padding:12px;margin-bottom:16px;">
        <img src="${pendingImage.dataUrl}" style="width:100%;max-height:180px;object-fit:contain;border-radius:3px;margin-bottom:10px;background:#eee;" />
        ${pendingImage.loading ? `<div style="text-align:center;font-size:12.5px;color:#5C574C;">文字を読み取り中…</div>` : `
        <div style="font-size:12px;color:#5C574C;margin-bottom:8px;">${pendingImage.error ? '読み取りに失敗しました。金額を手入力してください' : '読み取り結果を確認・修正してください'}</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <input id="pStore" class="input" placeholder="店名" value="${pendingImage.store||''}" />
          <input id="pAmount" class="input" placeholder="金額" type="number" value="${pendingImage.guessedAmount||''}" />
          <select id="pCategory" class="input">${CATEGORIES.map(c=>`<option value="${c}" ${c===pendingImage.category?'selected':''}>${c}</option>`).join("")}</select>
          <div style="display:flex;gap:8px;">
            <button id="pConfirm" class="btn-primary">記帳する</button>
            <button id="pCancel" class="btn-secondary">取り消し</button>
          </div>
        </div>`}
      </div>`;
    if (!pendingImage.loading) {
      document.getElementById("pConfirm").addEventListener("click", () => {
        confirmPending(
          document.getElementById("pAmount").value,
          document.getElementById("pStore").value,
          document.getElementById("pCategory").value
        );
        render();
      });
      document.getElementById("pCancel").addEventListener("click", () => { pendingImage = null; render(); });
    }
  }

  load();
})();
</script>
